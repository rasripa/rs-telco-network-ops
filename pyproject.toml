[project]
name = "rs-telco-network-ops"
version = "0.1.0"
description = "AnyTel Network Ops Agent - AI-assisted troubleshooting system built on Amazon Bedrock AgentCore, Strands Agents, DynamoDB, and Streamlit"
requires-python = ">=3.11,<3.14"
dependencies = [
    "boto3==1.43.91",
    "mcp==2.1.1",
    "strands-agents==1.55.1",
    "bedrock-agentcore==1.22.0",
    "bedrock-agentcore-starter-toolkit==0.3.12",
    "streamlit==1.63.0",
]

[dependency-groups]
dev = [
    "hypothesis==6.168.0",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
